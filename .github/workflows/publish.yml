name: Publish to NPM

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Require a stable release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (version.includes("-")) {
              throw new Error("The production workflow publishes stable versions to latest. Remove the prerelease suffix before releasing.");
            }
            console.log(`Preparing stable release ${version}`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm run test -- --passWithNoTests

      - name: Verify built package without a browser DOM
        run: npm run test:ssr

      - name: Verify publish contents
        run: npm run pack:check

      - name: Publish package
        if: github.ref == 'refs/heads/production'
        run: npm publish --access public --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
